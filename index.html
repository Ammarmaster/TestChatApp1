<!DOCTYPE html>
<html>
<head>
  <title>Prodevopz Dark Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
    }

    .branding {
      font-size: 24px;
      text-align: center;
      font-weight: bold;
      color: #00bcd4;
      margin-bottom: 10px;
    }

    input, button {
      padding: 12px;
      margin: 6px 0;
      width: 100%;
      box-sizing: border-box;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      background-color: #1f1f1f;
      color: #fff;
      border: 1px solid #444;
    }

    button {
      background-color: #00bcd4;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      background-color: #1e1e1e;
      padding: 10px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    .message {
      background-color: #333;
      margin-bottom: 8px;
      padding: 10px;
      border-radius: 10px;
      max-width: 75%;
      color: #fff;
    }

    .own {
      background-color: #00695c;
      align-self: flex-end;
    }

    #chatSection {
      display: none;
      flex-direction: column;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="branding">Prodevopz Dark Chat</div>

    <div id="authSection">
      <input type="text" id="username" placeholder="Enter Username">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Password">
      <button onclick="register()">Register</button>
      <button onclick="login()">Login</button>
    </div>

    <div id="chatSection">
      <div id="messages"></div>
      <input type="text" id="messageInput" placeholder="Type message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, query, orderBy, setDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXpJ1bDfzBqaYg4enm-GyrPdD6H_EEhUA",
      authDomain: "chatapp-900cf.firebaseapp.com",
      projectId: "chatapp-900cf",
      storageBucket: "chatapp-900cf.appspot.com",
      messagingSenderId: "461600057635",
      appId: "1:461600057635:web:3ef8e3ded53455ef80c496"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUsername = "";

    async function register() {
      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      await setDoc(doc(db, "users", userCredential.user.uid), { username: username });
    }

    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const userCredential = await signInWithEmailAndPassword(auth, email, password);
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const userDoc = await getDoc(doc(db, "users", user.uid));
        currentUsername = userDoc.exists() ? userDoc.data().username : "Anonymous";

        document.getElementById("authSection").style.display = "none";
        document.getElementById("chatSection").style.display = "flex";

        const q = query(collection(db, "messages"), orderBy("timestamp"));
        onSnapshot(q, (snapshot) => {
          const messagesDiv = document.getElementById("messages");
          messagesDiv.innerHTML = "";
          snapshot.forEach(doc => {
            const data = doc.data();
            const msgDiv = document.createElement("div");
            msgDiv.className = "message";
            if (data.username === currentUsername) msgDiv.classList.add("own");
            msgDiv.innerText = `${data.username}: ${data.text}`;
            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
          });
        });
      }
    });

    async function sendMessage() {
      const msg = document.getElementById("messageInput").value;
      if (!msg.trim()) return;

      await addDoc(collection(db, "messages"), {
        text: msg,
        username: currentUsername,
        timestamp: serverTimestamp()
      });

      document.getElementById("messageInput").value = "";
    }

    window.register = register;
    window.login = login;
    window.sendMessage = sendMessage;
  </script>
</body>
</html>
