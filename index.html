<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prodevopz Chat</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: url('https://images.unsplash.com/photo-1526401485004-2fda9f4b7f57') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      backdrop-filter: blur(5px);
    }

    .chat-container {
      width: 90%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      padding: 20px;
      backdrop-filter: blur(20px);
      color: #fff;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    #chat-box {
      height: 300px;
      overflow-y: auto;
      margin-bottom: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px;
    }

    .message {
      margin: 5px 0;
      background: rgba(255, 255, 255, 0.2);
      padding: 5px 10px;
      border-radius: 10px;
    }

    input, button {
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      width: 100%;
      box-sizing: border-box;
    }

    #send-btn {
      background: #ff4081;
      color: white;
      margin-top: 5px;
    }

    #login-btn {
      background: #4285F4;
      color: white;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <h1 onclick="location.reload()">Prodevopz Chat</h1>

    <div id="user-info" style="text-align: center; margin-bottom: 10px;"></div>

    <div id="chat-box"></div>

    <input type="text" id="msg-input" placeholder="Type your message..." />
    <button id="send-btn">Send</button>

    <button id="login-btn">Login with Google</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAXpJ1bDfzBqaYg4enm-GyrPdD6H_EEhUA",
      authDomain: "chatapp-900cf.firebaseapp.com",
      projectId: "chatapp-900cf",
      storageBucket: "chatapp-900cf.appspot.com",
      messagingSenderId: "461600057635",
      appId: "1:461600057635:web:3ef8e3ded53455ef80c496",
      measurementId: "G-TXSSBKSFCC"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    const chatBox = document.getElementById("chat-box");
    const sendBtn = document.getElementById("send-btn");
    const msgInput = document.getElementById("msg-input");
    const loginBtn = document.getElementById("login-btn");
    const userInfo = document.getElementById("user-info");

    loginBtn.onclick = () => {
      signInWithPopup(auth, provider)
        .then((result) => {
          currentUser = result.user;
          userInfo.innerText = `Hello, ${currentUser.displayName}`;
          loginBtn.style.display = "none";
        })
        .catch((error) => {
          alert("Login Failed: " + error.message);
        });
    };

    sendBtn.onclick = async () => {
      if (!currentUser) {
        alert("Please login first");
        return;
      }
      const text = msgInput.value.trim();
      if (text) {
        await addDoc(collection(db, "messages"), {
          text,
          name: currentUser.displayName,
          timestamp: new Date()
        });
        msgInput.value = "";
      }
    };

    const q = query(collection(db, "messages"), orderBy("timestamp"));
    onSnapshot(q, (snapshot) => {
      chatBox.innerHTML = "";
      snapshot.forEach((doc) => {
        const msg = doc.data();
        const div = document.createElement("div");
        div.className = "message";
        div.innerText = `${msg.name}: ${msg.text}`;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
      });
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        userInfo.innerText = `Hello, ${user.displayName}`;
        loginBtn.style.display = "none";
      }
    });
  </script>
</body>
</html>
