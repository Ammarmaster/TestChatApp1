<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prodevopz Chat</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #121212;
      color: #f5f5f5;
    }
    .header {
      text-align: center;
      padding: 10px;
      background: #1e1e1e;
      font-size: 24px;
      font-weight: bold;
      color: #00f5d4;
      letter-spacing: 1px;
    }
    #chatContainer {
      display: flex;
      flex-direction: column;
      height: 90vh;
      padding: 10px;
    }
    #messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #1f1f1f;
      padding: 10px;
      border-radius: 8px;
    }
    .message {
      margin-bottom: 8px;
      padding: 6px 10px;
      background: #333;
      border-radius: 6px;
    }
    .message strong {
      color: #00f5d4;
    }
    #typingStatus {
      font-style: italic;
      color: #aaaaaa;
      margin: 5px 0;
    }
    #inputSection {
      display: flex;
      gap: 5px;
    }
    input, button {
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }
    input {
      flex: 1;
      background: #2e2e2e;
      color: white;
    }
    button {
      background: #00f5d4;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
    #loginForm {
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="header">Prodevopz Chat</div>

  <div id="loginForm">
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="password" placeholder="Password" />
    <input type="text" id="username" placeholder="Username" />
    <button onclick="login()">Login / Sign Up</button>
  </div>

  <div id="chatContainer" style="display:none;">
    <div id="messages"></div>
    <div id="typingStatus"></div>
    <div id="inputSection">
      <input type="text" id="messageInput" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

    // TODO: Replace with your Firebase config
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth();

    let currentUsername = "";

    async function login() {
      const email = document.getElementById("email").value;
      const pass = document.getElementById("password").value;
      currentUsername = document.getElementById("username").value;

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (e) {
        await createUserWithEmailAndPassword(auth, email, pass);
      }
    }

    onAuthStateChanged(auth, user => {
      if (user) {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("chatContainer").style.display = "flex";
        startChat();
      }
    });

    const messagesRef = collection(db, "messages");
    const typingRef = doc(db, "typingStatus", "status");

    function sendMessage() {
      const msg = document.getElementById("messageInput").value;
      if (!msg) return;

      addDoc(messagesRef, {
        username: currentUsername,
        text: msg,
        time: serverTimestamp()
      });

      document.getElementById("messageInput").value = "";
      setDoc(typingRef, { typing: false });
    }

    function startChat() {
      const q = query(messagesRef, orderBy("time"));
      const messagesDiv = document.getElementById("messages");

      onSnapshot(q, snapshot => {
        messagesDiv.innerHTML = "";
        snapshot.forEach(doc => {
          const m = doc.data();
          const div = document.createElement("div");
          div.className = "message";
          div.innerHTML = `<strong>${m.username}:</strong> ${m.text}`;
          messagesDiv.appendChild(div);
        });
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      });

      // Typing indicator
      document.getElementById("messageInput").addEventListener("input", () => {
        setDoc(typingRef, {
          username: currentUsername,
          typing: true,
          timestamp: serverTimestamp()
        });
        clearTimeout(window.typingTimeout);
        window.typingTimeout = setTimeout(() => {
          setDoc(typingRef, { typing: false });
        }, 2000);
      });

      onSnapshot(typingRef, docSnap => {
        const data = docSnap.data();
        const statusDiv = document.getElementById("typingStatus");
        if (data?.typing && data.username !== currentUsername) {
          statusDiv.textContent = `✍️ ${data.username} is typing...`;
        } else {
          statusDiv.textContent = "";
        }
      });
    }
  </script>
</body>
</html>
